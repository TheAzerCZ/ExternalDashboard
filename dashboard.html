<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palubka – ETS2</title>
<style>
  /* Bahnschrift = DIN 1451, písmo německých dálničních cedulí. Je součástí Windows, nic se nestahuje. */
  :root {
    --road: #1a2430;        /* noční asfalt */
    --road-2: #212d3b;
    --line: #2d3b4b;
    --sign: #0e518d;        /* RAL 5017, modrá dálničních cedulí */
    --white: #f2f4f2;
    --muted: #8a9bad;
    --red: #c1121c;         /* RAL 3020, okraj značky */
    --amber: #f5a800;       /* RAL 1003, přechodné značení */
    --green: #2fa36b;
    --u: min(0.86vw, 1.53vh);  /* základní jednotka, škáluje s monitorem */
    font-family: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--road); color: var(--white); overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr; gap: calc(var(--u)*1.2); padding: calc(var(--u)*1.2); }

  /* ---------- Dálniční cedule ---------- */
  .sign {
    background: var(--sign); border-radius: calc(var(--u)*1.1); padding: calc(var(--u)*0.45);
    transition: filter .3s;
  }
  .sign-inner {
    border: calc(var(--u)*0.3) solid var(--white); border-radius: calc(var(--u)*0.8);
    padding: calc(var(--u)*1.3) calc(var(--u)*2);
    display: grid; grid-template-columns: 1fr auto; gap: calc(var(--u)*1) calc(var(--u)*3); align-items: end;
  }
  .paused .sign { filter: saturate(.35) brightness(.8); }
  .dest { font-stretch: 75%; font-weight: 600; line-height: .95; }
  .dest .from { font-size: calc(var(--u)*2.2); opacity: .75; font-weight: 400; }
  .dest .to { font-size: calc(var(--u)*6); letter-spacing: -.01em; }
  .dest .co { font-size: calc(var(--u)*1.5); opacity: .7; font-weight: 400; margin-top: calc(var(--u)*.4); }
  .eta { display: flex; gap: calc(var(--u)*3.2); text-align: right; }
  .eta b { display: block; font-size: calc(var(--u)*5.2); font-weight: 600; line-height: 1; font-stretch: 87.5%; }
  .eta small { font-size: calc(var(--u)*1.35); opacity: .8; }
  .eta em { display: block; font-style: normal; font-size: calc(var(--u)*1.9); font-weight: 600; margin-top: calc(var(--u)*.5); }
  .eta em:empty { display: none; }
  .eta .real b { color: var(--white); }
  .progress { grid-column: 1 / -1; position: relative; height: calc(var(--u)*1.6); margin-top: calc(var(--u)*.4); }
  .progress::before { /* vodorovné značení: přerušovaná čára */
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: calc(var(--u)*.3);
    background: repeating-linear-gradient(90deg, rgba(242,244,242,.35) 0 calc(var(--u)*1.6), transparent 0 calc(var(--u)*2.6));
    transform: translateY(-50%);
  }
  .progress .done { position: absolute; left: 0; top: 50%; height: calc(var(--u)*.3); background: var(--white); transform: translateY(-50%); }
  .progress .truck {
    position: absolute; top: 50%; width: calc(var(--u)*1.6); height: calc(var(--u)*1.6); border-radius: 50%;
    background: var(--white); transform: translate(-50%, -50%); box-shadow: 0 0 0 calc(var(--u)*.35) var(--sign);
  }
  .progress .pct { position: absolute; right: 0; top: calc(var(--u)*-1.6); font-size: calc(var(--u)*1.2); opacity: .8; }
  .no-route .dest .to { font-size: calc(var(--u)*4); }

  /* ---------- Sloupce ---------- */
  main { display: grid; grid-template-columns: 1.1fr 1.1fr 0.85fr 1.1fr; gap: calc(var(--u)*1.2); min-height: 0; }
  section { background: var(--road-2); border-radius: calc(var(--u)*.6); padding: calc(var(--u)*1.4) calc(var(--u)*1.6); display: flex; flex-direction: column; gap: calc(var(--u)*1.2); min-height: 0; overflow: hidden; }
  h2 { font-size: calc(var(--u)*1.25); font-weight: 400; color: var(--muted); }
  .rows { align-items: baseline; display: grid; grid-template-columns: 1fr auto; row-gap: calc(var(--u)*.45); column-gap: calc(var(--u)*1); font-size: calc(var(--u)*1.45); }
  .rows dt { color: var(--muted); white-space: nowrap; }
  .rows dd { white-space: nowrap; }
  .rows dd { text-align: right; }
  .rows dd small { color: var(--muted); font-size: .8em; display: block; }
  #srows { grid-template-columns: minmax(0, 1fr) auto; }
  #srows dt { white-space: normal; }
  #srows dd { white-space: normal; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; column-gap: .6em; }
  #srows dd small { display: inline; white-space: nowrap; }
  .cruise { display: flex !important; align-items: center; gap: .4em; }
  .cruise .cc-icon { width: 1.3em; height: 1.3em; flex: none; }
  .cruise.on { color: var(--green) !important; }
  .rule { border-top: 1px solid var(--line); }

  /* rychlost */
  .speed { display: flex; align-items: center; gap: calc(var(--u)*2); }
  .speed .num { font-size: calc(var(--u)*10); font-weight: 600; line-height: .85; font-stretch: 87.5%; min-width: 2.3ch; flex: none; }
  .speed .num small { display: block; font-size: calc(var(--u)*1.4); font-weight: 400; color: var(--muted); margin-top: calc(var(--u)*.6); }
  .limit {
    width: calc(var(--u)*7.5); height: calc(var(--u)*7.5); border-radius: 50%; background: var(--white);
    border: calc(var(--u)*.95) solid var(--red); color: #111; display: grid; place-items: center;
    font-size: calc(var(--u)*3.1); font-weight: 700; font-stretch: 87.5%; flex: none;
  }
  .limit.none { background: transparent; border-color: var(--line); color: var(--muted); font-size: calc(var(--u)*1.3); font-weight: 400; }
  .over .num { color: var(--amber); }
  .gearbox { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: calc(var(--u)*1.2); }
  .gearbox .g { font-size: calc(var(--u)*3.4); font-weight: 600; line-height: 1; min-width: 1.6ch; }
  .gearbox small { color: var(--muted); font-size: calc(var(--u)*1.2); white-space: nowrap; }
  .bar { height: calc(var(--u)*.7); background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--white); border-radius: inherit; transition: width .25s linear; }
  .bar.warn i { background: var(--amber); }
  .bar.bad i { background: var(--red); }
  .bar.ok i { background: var(--green); }
  .chips { display: flex; flex-wrap: wrap; gap: calc(var(--u)*.5); }
  .chip { font-size: calc(var(--u)*1.1); padding: calc(var(--u)*.3) calc(var(--u)*.75); border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .chip.on { background: var(--white); color: var(--road); border-color: var(--white); }
  .chip.alert { background: var(--amber); color: #1a1a1a; border-color: var(--amber); }
    .chip.blink { animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .tank { display: grid; grid-template-columns: auto 1fr auto; gap: calc(var(--u)*1); align-items: center; font-size: calc(var(--u)*1.4); }
  .tank span:first-child { color: var(--muted); width: 5ch; }
  .gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*.9) calc(var(--u)*1.2); }
  .gauges div { font-size: calc(var(--u)*1.7); font-weight: 600; white-space: nowrap; }
  .gauges div small { display: block; font-size: calc(var(--u)*1.1); font-weight: 400; color: var(--muted); }
  .gauges .alert { color: var(--amber); }

  /* zakázka */
  .cargo { font-size: calc(var(--u)*3); font-weight: 600; line-height: 1.05; font-stretch: 87.5%; }
  .cargo small { display: block; font-size: calc(var(--u)*1.45); font-weight: 400; color: var(--muted); margin-top: calc(var(--u)*.4); }
  .pay { font-size: calc(var(--u)*2.6); font-weight: 600; }
  .pay small { font-size: calc(var(--u)*1.4); color: var(--muted); font-weight: 400; margin-left: .4em; }
  .rest { display: flex; gap: calc(var(--u)*1.4); align-items: center; }
  .rest svg { width: calc(var(--u)*5.2); height: calc(var(--u)*5.2); flex: none; }
  .rest b { font-size: calc(var(--u)*2.8); font-weight: 600; display: block; line-height: 1; }
  .rest span { color: var(--muted); font-size: calc(var(--u)*1.35); }
  .rest.soon b { color: var(--amber); }
  .rest.over b { color: #ff5a52; }
  .blinkers { display: flex; gap: calc(var(--u)*1.2); font-size: calc(var(--u)*2.4); color: var(--line); line-height: 1; }
  .blinkers .on { color: var(--green); }
  .clock { font-size: calc(var(--u)*2.2); font-weight: 600; }

  /* opotřebení */
  .wear { display: grid; grid-template-columns: auto 1fr auto; white-space: nowrap; gap: calc(var(--u)*.7) calc(var(--u)*1); align-items: center; font-size: calc(var(--u)*1.35); }
  .wear span:first-child { color: var(--muted); }
  .wear span:last-child { text-align: right; }
  .veh { font-size: calc(var(--u)*1.9); font-weight: 600; }
  .veh small { color: var(--muted); font-weight: 400; font-size: .7em; margin-left: .4em; }

  /* relace */
  .big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*1); }
  .big3 div { white-space: nowrap; font-size: calc(var(--u)*2.3); font-weight: 600; line-height: 1.05; }
  .big3 small { white-space: normal; display: block; font-size: calc(var(--u)*1.1); color: var(--muted); font-weight: 400; }
  .log { list-style: none; padding: 0; display: grid; gap: calc(var(--u)*.45); font-size: calc(var(--u)*1.3); overflow: hidden; }
  .log li { display: grid; grid-template-columns: 5ch 1fr auto; gap: calc(var(--u)*.8); }
  .log time { color: var(--muted); }
  .log .fine { color: var(--amber); }
  .log li.empty { display: block; }
  .log .job { color: var(--green); }
  .log .dmg { color: #ff5a52; }
  #midSec { gap: calc(var(--u)*1); }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*1); }
  .times b { display: block; font-size: calc(var(--u)*2.4); font-weight: 600; line-height: 1.1; }
  .times small { color: var(--muted); font-size: calc(var(--u)*1.2); }
  .times div:last-child { text-align: right; }
  .clock { font-size: calc(var(--u)*2); font-weight: 600; }
  .btns { display: flex; gap: calc(var(--u)*.5); flex: none; }
  .btns button { white-space: nowrap; }
  #since { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .head { gap: calc(var(--u)*.8); }
  section.flash { animation: flash 1s ease-out 3; }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 calc(var(--u)*.35) #ff5a52; } 100% { box-shadow: inset 0 0 0 0 transparent; } }
  /* souhrn doručení */
  #delivery, #history { position: fixed; inset: 0; background: rgba(26,36,48,.9); display: grid; place-items: center; z-index: 10; }
  #delivery[hidden], #history[hidden] { display: none; }
  .dcard { background: var(--road-2); border-radius: calc(var(--u)*1); padding: calc(var(--u)*2.4); width: min(90vw, calc(var(--u)*70)); display: grid; gap: calc(var(--u)*2); }
  .dsign { background: var(--green); border-radius: calc(var(--u)*.7); padding: calc(var(--u)*1.2) calc(var(--u)*1.8); box-shadow: inset 0 0 0 calc(var(--u)*.3) var(--white); }
  .dsign.cancel { background: var(--red); }
  .dsign span { display: block; font-size: calc(var(--u)*1.6); opacity: .85; }
  .dsign b { font-size: calc(var(--u)*4); font-weight: 600; font-stretch: 87.5%; }
  .dgrid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: calc(var(--u)*1.5); }
  .dgrid b { display: block; white-space: nowrap; font-size: calc(var(--u)*2.6); font-weight: 600; }
  .dgrid small, .dhint { color: var(--muted); font-size: calc(var(--u)*1.2); }
  .dstyle { display: flex; align-items: center; gap: calc(var(--u)*1.6); border-top: 1px solid var(--line); padding-top: calc(var(--u)*1.6); }
  .dstyle[hidden] { display: none; }
  .dscore { width: calc(var(--u)*8); height: calc(var(--u)*8); border-radius: 50%; border: calc(var(--u)*.5) solid var(--green); display: grid; place-content: center; text-align: center; flex: none; }
  .dscore b { font-size: calc(var(--u)*3.2); font-weight: 600; line-height: 1; }
  .dscore small { font-size: calc(var(--u)*1); color: var(--muted); }
  .dscore.mid { border-color: var(--amber); } .dscore.low { border-color: #ff5a52; }
  .dstyle strong { display: block; font-size: calc(var(--u)*2.2); font-weight: 600; }
  .dstyle span { color: var(--muted); font-size: calc(var(--u)*1.35); }
  .sc-hi { color: var(--green); } .sc-mid { color: var(--amber); } .sc-low { color: #ff5a52; }
  /* historie */
  .hwrap { background: var(--road-2); border-radius: calc(var(--u)*1); padding: calc(var(--u)*2); width: 94vw; height: 90vh; display: flex; flex-direction: column; gap: calc(var(--u)*1.6); overflow: hidden; }
  .hwrap h1 { font-size: calc(var(--u)*2.6); font-weight: 600; }
  .hbig { grid-template-columns: repeat(5, 1fr); }
  .hbig { grid-template-columns: 1fr 1.4fr 1.2fr 1fr 1.8fr; }
  .hbig div { font-size: calc(var(--u)*2.8); white-space: normal; }
  .hbig div:last-child { font-size: calc(var(--u)*2); }
  .hcols { display: grid; grid-template-columns: 1fr 1.6fr; gap: calc(var(--u)*2.4); min-height: 0; flex: 1; }
  .hcols > div { display: flex; flex-direction: column; gap: calc(var(--u)*1); min-height: 0; }
  .days { flex: 1; display: flex; align-items: flex-end; gap: calc(var(--u)*.6); min-height: 0; padding-bottom: calc(var(--u)*3.2); position: relative; }
  .day { flex: 1; max-width: calc(var(--u)*5); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
  .day i { width: 100%; background: var(--sign); border-radius: calc(var(--u)*.3) calc(var(--u)*.3) 0 0; min-height: 2px; }
  .day span { font-size: calc(var(--u)*1.05); color: var(--muted); position: absolute; bottom: calc(var(--u)*-2.8); white-space: nowrap; }
  .day em { font-style: normal; font-size: calc(var(--u)*1); margin-bottom: calc(var(--u)*.3); white-space: nowrap; }
  .htable-wrap { overflow: auto; min-height: 0; }
  #hJobs { width: 100%; border-collapse: collapse; font-size: calc(var(--u)*1.3); }
  #hJobs th { text-align: left; font-weight: 400; color: var(--muted); padding: calc(var(--u)*.5) calc(var(--u)*.6); position: sticky; top: 0; background: var(--road-2); }
  #hJobs td { padding: calc(var(--u)*.5) calc(var(--u)*.6); border-top: 1px solid var(--line); white-space: nowrap; }
  #hJobs .r { text-align: right; }
  #hJobs tr.bad td { color: #ff5a52; }
  .neg { color: var(--amber); }
  .warn-t { color: var(--amber); }
  .muted-t { color: var(--muted); }
  .pos { color: var(--green); }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  button { font: inherit; font-size: calc(var(--u)*1.1); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 99px; padding: calc(var(--u)*.25) calc(var(--u)*.9); cursor: pointer; }
  button:hover { color: var(--white); border-color: var(--muted); }
  button.armed { color: #1a1a1a; background: var(--amber); border-color: var(--amber); }
  button:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .empty { color: var(--muted); font-size: calc(var(--u)*1.4); }

  /* odpojeno */
  #offline { position: fixed; inset: 0; background: rgba(26,36,48,.94); display: none; place-items: center; text-align: center; }
  .offline #offline { display: grid; }
  #offline h1 { font-size: calc(var(--u)*3.4); font-weight: 600; margin-bottom: calc(var(--u)*1); }
  #offline p { color: var(--muted); font-size: calc(var(--u)*1.5); max-width: 60ch; line-height: 1.45; }
  #offline code { color: var(--white); }
  .pausechip { position: fixed; z-index: 5; top: calc(var(--u)*2.2); left: 50%; transform: translateX(-50%); background: var(--amber); color: #1a1a1a; padding: calc(var(--u)*.3) calc(var(--u)*1.2); border-radius: 99px; font-size: calc(var(--u)*1.3); display: none; }
  .paused .pausechip { display: block; }
  @media (prefers-reduced-motion: reduce) {   .chip.blink { animation: none; } .bar i { transition: none; } }
  /* nastavení */
  #settings { position: fixed; inset: 0; background: rgba(26,36,48,.9); display: grid; place-items: center; z-index: 11; }
  #settings[hidden] { display: none; }
  .scard { background: var(--road-2); border-radius: calc(var(--u)*1); padding: calc(var(--u)*2.4); width: min(92vw, calc(var(--u)*60)); display: grid; gap: calc(var(--u)*1.6); }
  .scard h1 { font-size: calc(var(--u)*2.6); font-weight: 600; }
  .scard fieldset { border: 1px solid var(--line); border-radius: calc(var(--u)*.6); padding: calc(var(--u)*1.2) calc(var(--u)*1.4); display: grid; gap: calc(var(--u)*1); }
  .scard legend { color: var(--muted); font-size: calc(var(--u)*1.25); padding: 0 .4em; }
  .srow { display: flex; align-items: center; gap: calc(var(--u)*1); font-size: calc(var(--u)*1.5); flex-wrap: wrap; }
  .srow > span:first-child { color: var(--muted); min-width: 9ch; }
  .scard select, .scard input { font: inherit; font-size: calc(var(--u)*1.5); color: var(--white); background: var(--road); border: 1px solid var(--line); border-radius: calc(var(--u)*.4); padding: calc(var(--u)*.35) calc(var(--u)*.7); }
  .scard input { width: 11ch; text-align: right; }
  .scard input:disabled { opacity: .45; }
  .scard select:focus-visible, .scard input:focus-visible { outline: 2px solid var(--white); outline-offset: 1px; }
  .shint { color: var(--muted); font-size: calc(var(--u)*1.15); line-height: 1.4; }
  .sbtns { display: flex; justify-content: flex-end; gap: calc(var(--u)*.8); }
  .sbtns button { font-size: calc(var(--u)*1.4); padding: calc(var(--u)*.45) calc(var(--u)*1.4); }
  button.primary { background: var(--white); color: var(--road); border-color: var(--white); }
  button.primary:hover { color: var(--road); }
  .gtabs { display: flex; gap: calc(var(--u)*.5); }
  .gtabs button.on { background: var(--white); color: var(--road); border-color: var(--white); }
  #setBtn svg { width: 1.2em; height: 1.2em; vertical-align: -.25em; }
</style>
</head>
<body class="offline">
<div class="pausechip" data-i18n="paused"></div>

<header class="sign"><div class="sign-inner" id="sign">
  <div class="dest"><div class="from" id="from">–</div><div class="to" id="to"></div><div class="co" id="co"></div></div>
  <div class="eta">
    <div><b id="dist">–</b><small data-i18n="left"></small></div>
    <div class="real"><b id="real">–</b><small data-i18n="real"></small><em id="realGame"></em></div>
    <div><b id="arr">–</b><small data-i18n="arrivalReal"></small><em id="arrGame"></em></div>
  </div>
  <div class="progress" id="prog"><div class="done" id="done"></div><div class="truck" id="truck"></div></div>
</div></header>

<main>
  <section>
    <div class="head"><h2 data-i18n="drive"></h2><div class="blinkers"><span id="bl">◀</span><span id="br">▶</span></div></div>
    <div class="speed" id="speedbox">
      <div class="num"><span id="spd">0</span><small class="cruise" id="cruise"><svg class="cc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 17a8.5 8.5 0 1 1 15 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M12 13.5l4.2-4.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="13.5" r="1.8" fill="currentColor"/><path d="M8 20.5h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span id="cruiseTxt"></span></small></div>
      <div class="limit none" id="lim"></div>
    </div>
    <div class="gearbox"><div class="g" id="gear">N</div><div class="bar" id="rpmbar"><i id="rpm"></i></div><small id="retarder"></small></div>
    <div class="chips" id="chips"></div>
    <div class="rule"></div>
    <div class="tank"><span data-i18n="diesel"></span><div class="bar" id="fuelbar"><i id="fuel"></i></div><span id="fuelTxt">–</span></div>
    <div class="tank"><span>AdBlue</span><div class="bar" id="adbar"><i id="ad"></i></div><span id="adTxt">–</span></div>
    <dl class="rows">
      <dt data-i18n="range"></dt><dd id="range">–</dd>
      <dt data-i18n="avgCons"></dt><dd id="avg">–</dd>
    </dl>
  </section>

  <section id="midSec">
    <h2 data-i18n="restPlan"></h2>
    <div class="rest" id="restbox">

};
const NATIVE = { ets2: 'EUR', ats: 'USD' };   // měna, ve které hra posílá částky
const DEFAULT_RATES = {                        // výchozí kurzy při změně měny (přibližné, dají se upravit)
  EUR: { EUR: 1, CZK: 24.4945, USD: 1.1, GBP: 0.85, PLN: 4.3 },
  USD: { USD: 1, CZK: 22.3, EUR: 0.91, GBP: 0.77, PLN: 3.9 },
};
const CURRENCIES = ['CZK', 'EUR', 'USD', 'GBP', 'PLN'];

let settings = { lang: 'cs', ets2: { currency: 'CZK', rate: 24.4945 }, ats: { currency: 'USD', rate: 1 } };
let lang = 'cs', locale = 'cs-CZ', gameKey = 'ets2', lastView = null;

const t = (key, p = {}) => {
  const s = (I18N[lang] && I18N[lang][key]) ?? I18N.cs[key] ?? key;
  return typeof s === 'string' ? s.replace(/\{(\w+)\}/g, (_, k) => p[k] ?? '') : s;
};
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.title = lang === 'en' ? 'Truck dashboard' : 'Palubka';
}
function setSettings(s) {
  const changed = JSON.stringify(s) !== JSON.stringify(settings);
  settings = s;
  if (changed || lang !== s.lang) {
    lang = s.lang; locale = lang === 'en' ? 'en-GB' : 'cs-CZ';
    applyStatic(); tickClock();
  }
}

// ============================================================ formátování
const $ = id => document.getElementById(id);
const nf = (v, d = 0) => v == null || isNaN(v) ? '–' : v.toLocaleString(locale, { minimumFractionDigits: d, maximumFractionDigits: d });
const hm = s => { if (s == null) return '–'; s = Math.max(0, Math.round(s / 60)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const hmGame = m => m == null ? '–' : `${Math.floor(m / 60)} h ${String(Math.floor(m % 60)).padStart(2, '0')} min`;
const clock = ts => ts ? new Date(ts * 1000).toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' }) : '–';
const gameClock = m => { m = Math.floor(m); return `${t('days')[Math.floor(m / 1440) % 7]} ${String(Math.floor(m % 1440 / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const REST_WARN_MIN = 95;  // hra hlásí únavu cca 1 h 35 min před povinnou pauzou

// částky: hra posílá € (ETS2) nebo $ (ATS), převádíme podle nastavení dané hry
const curOf = g => settings[g] || { currency: NATIVE[g], rate: 1 };
const money = (v, g = gameKey, d = 0) => {
  if (v == null || isNaN(v)) return '–';
  const c = curOf(g), x = v * c.rate;
  return new Intl.NumberFormat(locale, { style: 'currency', currency: c.currency, minimumFractionDigits: d, maximumFractionDigits: d }).format(Math.abs(x) < 0.5 && d === 0 ? 0 : x);
};
const curSym = g => new Intl.NumberFormat(locale, { style: 'currency', currency: curOf(g).currency, currencyDisplay: 'narrowSymbol' })
  .formatToParts(0).find(p => p.type === 'currency').value;

function wearRows(el, obj) {
  el.innerHTML = Object.entries(obj).map(([k, v]) => {
    const p = v * 100, cls = p >= 40 ? 'bad' : p >= 15 ? 'warn' : 'ok';
    return `<span>${t(k)}</span><div class="bar ${cls}"><i style="width:${Math.max(p, 1.5)}%"></i></div><span>${nf(p)} %</span>`;
  }).join('');
}

// ============================================================ vykreslení
function render(v) {
  lastView = v;
  if (v.settings) setSettings(v.settings);
  document.body.classList.toggle('offline', !v.connected);
  gameKey = ((v.connected ? v.game : v.stats && v.stats.game) || 'ETS2').toLowerCase();
  if (v.stats) renderStats(v.stats);
  if (!v.connected) return;
  document.body.classList.toggle('paused', v.paused);

  // cedule
  const j = v.job, r = v.route;
  $('from').textContent = j ? `${j.from} →` : (r ? t('navigation') : '–');
  $('to').textContent = j ? j.to : (r ? t('customRoute') : t('noJob'));
  $('co').textContent = j ? `${j.compFrom} → ${j.compTo}` : '';
  $('sign').classList.toggle('no-route', !r);
  $('dist').textContent = r ? `${nf(r.km)} km` : '–';
  $('real').textContent = r ? hm(r.realS) : '–';
  $('arr').textContent = r ? clock(r.arrival) : '–';
  $('realGame').textContent = r ? t('gameLeft', { t: hmGame(r.gameMin) }) : '';
  $('arrGame').textContent = r ? t('gameArrival', { t: gameClock(v.timeAbs + r.gameMin) }) : '';
  const planned = j && j.plannedKm ? j.plannedKm : null;
  const pct = r && planned ? Math.min(100, Math.max(0, (1 - r.km / planned) * 100)) : null;
  $('prog').style.visibility = pct == null ? 'hidden' : 'visible';
  if (pct != null) { $('done').style.width = pct + '%'; $('truck').style.left = pct + '%'; $('prog').title = t('routePct', { p: nf(pct) }); }

  // jízda
  const spd = Math.round(v.speed), lim = Math.round(v.limit);
  $('spd').textContent = spd;
  $('speedbox').classList.toggle('over', lim > 0 && spd > lim + 2);
  const L = $('lim');
  L.className = lim > 0 ? 'limit' : 'limit none';
  L.textContent = lim > 0 ? lim : t('noLimit');
  $('cruiseTxt').textContent = v.cruise ? t('cruiseOn', { v: Math.round(v.cruise) }) : t('cruiseOff');
  $('cruise').classList.toggle('on', !!v.cruise);
  $('gear').textContent = v.gear;
  $('retarder').textContent = t('rpm', { v: nf(v.rpm) }) + (v.retarderMax ? ', ' + t('retarder', { a: v.retarder, b: v.retarderMax }) : '');
  const rp = v.rpmMax ? v.rpm / v.rpmMax * 100 : 0;
  $('rpm').style.width = rp + '%';
  $('rpmbar').className = 'bar' + (rp > 85 ? ' bad' : rp > 70 ? ' warn' : '');
  const l = v.lights;
  const chips = [
    ['lowBeam', l.lightsBeamLow], ['highBeam', l.lightsBeamHigh], ['beacon', l.lightsBeacon],
    ['hazard', l.lightsHazard, 'blink'], ['wipers', l.wipers], ['engineBrake', l.motorBrake],
    ['diffLock', l.differentialLock], ['liftAxle', l.liftAxle], ['parkBrake', l.parkBrake, 'alert'],
  ];
  $('bl').classList.toggle('on', !!l.blinkerLeftOn);
  $('br').classList.toggle('on', !!l.blinkerRightOn);
  $('chips').innerHTML = chips.map(([k, on, x]) => `<span class="chip${on ? (x === 'alert' ? ' alert' : ' on') : ''}${on && x === 'blink' ? ' blink' : ''}">${t(k)}</span>`).join('');
  const fp = v.fuelCap ? v.fuel / v.fuelCap * 100 : 0, ap = v.adblueCap ? v.adblue / v.adblueCap * 100 : 0;
  $('fuel').style.width = fp + '%'; $('fuelbar').className = 'bar' + (v.warn.fuelWarning ? ' bad' : fp < 25 ? ' warn' : '');
  $('fuelTxt').textContent = `${nf(v.fuel)} l / ${nf(fp)} %`;
  $('ad').style.width = ap + '%'; $('adbar').className = 'bar' + (v.warn.adblueWarning ? ' bad' : '');
  $('adTxt').textContent = `${nf(v.adblue)} l`;
  $('range').textContent = `${nf(v.fuelRange)} km`;
  // palubní počítač hry občas vynuluje průměr (hodnota 0), pak ukážeme průměr z relace
  const avg = v.fuelAvg > 0.5 ? v.fuelAvg : (v.stats && v.stats.km > 20 ? v.stats.avg_l100 : null);
  $('avg').textContent = avg ? `${nf(avg, 1)} l/100 km` : '–';
  $('odo').textContent = `${nf(v.odo)} km`;
  const w = v.warn;
  $('gauges').innerHTML = [
    ['oil', `${nf(v.oilTemp)} °C`, false], ['water', `${nf(v.waterTemp)} °C`, w.waterTemperatureWarning],
    ['brakes', `${nf(v.brakeTemp)} °C`, v.brakeTemp > 250], ['air', `${nf(v.air)} psi`, w.airPressureWarning],
    ['oilPress', `${nf(v.oilPress)} psi`, w.oilPressureWarning], ['battery', `${nf(v.battery, 1)} V`, w.batteryVoltageWarning],
  ].map(([k, val, a]) => `<div class="${a ? 'alert' : ''}">${val}<small>${t(k)}</small></div>`).join('');

  // zakázka
  if (j) {
    const sub = [`${nf(j.mass / 1000, 1)} t`, j.plannedKm ? t('route', { km: nf(j.plannedKm) }) : '', j.special ? t('special') : ''].filter(Boolean).join(', ');
    $('cargo').innerHTML = `${j.cargo || '–'}<small>${sub}</small>`;
    $('pay').innerHTML = `${money(j.income)}<small>${j.plannedKm ? money(j.income / j.plannedKm, gameKey, curOf(gameKey).currency === 'CZK' ? 0 : 2) + '/km' : ''}</small>`;
    const dl = j.deadlineMin;
    $('deadline').innerHTML = j.deadlineUnknown ? `<span class="muted-t">${t('deadlineUnknown')}</span>` : dl == null ? t('noDeadline')
      : dl < 0 ? `<span class="neg">${t('late', { t: hmGame(-dl) })}</span>`
      : `${hmGame(dl)}<small>${t('realSuffix', { t: hm(dl * 60 / v.scale) })}</small>`;
    const b = v.plan ? v.plan.bufferMin : null;
    $('bufferLbl').textContent = v.plan && v.plan.sleeps ? t('bufferNoSleep') : t('buffer');
    $('buffer').innerHTML = b == null ? '–' : b < 0 ? `<span class="neg">${t('wontMake', { t: hmGame(-b) })}</span>` : hmGame(b);
    $('cdmg').innerHTML = `<span class="${j.damage > 0.05 ? 'neg' : ''}">${nf(j.damage * 100, 1)} %</span>`;
  } else {
    $('cargo').innerHTML = `${t('noJob')}<small>${t('noJobHint')}</small>`;
    $('bufferLbl').textContent = t('buffer');
    ['pay', 'deadline', 'buffer', 'cdmg'].forEach(id => $(id).textContent = '–');
  }
  const rest = v.rest;
  $('rest').textContent = rest.gameMin > 0 ? hmGame(rest.gameMin) : t('restNow');
  $('restReal').textContent = rest.gameMin > 0 ? t('untilRest', { t: hm(rest.realS) }) : t('restFine');
  $('restbox').classList.toggle('soon', rest.gameMin > 0 && rest.gameMin <= REST_WARN_MIN);
  $('restbox').classList.toggle('over', rest.gameMin <= 0);
  $('gtime').textContent = gameClock(v.timeAbs);
  $('scale').textContent = t('gameTime');
  const p = v.plan;
  const spare = p && -p.shortMin < 60 ? `${Math.floor(-p.shortMin)} min` : p ? hmGame(-p.shortMin) : '';
  $('pSleep').innerHTML = !p ? '–' : p.sleeps === 0 ? `<span class="pos">${t('noSleep')}</span><small>${t('spare', { t: spare })}</small>`
    : p.sleeps === 1 && p.shortMin <= 60 ? `<span class="warn-t">${t('tight', { m: Math.ceil(p.shortMin) })}</span>`
    : `<span class="warn-t">${t('sleeps', { n: p.sleeps })}</span>`;
  $('pFuel').innerHTML = !p ? '–' : p.fuelOk ? `<span class="pos">${t('fuelOk')}</span>`
    : `<span class="warn-t">${t('refuel', { km: nf(p.fuelRange) })}</span>`;
  $('vehSec').classList.toggle('flash', !!v.damageFlash);
  showDelivery(v.delivery);

  // vůz
  $('truckName').innerHTML = `${v.truck.name}<small>${v.truck.plate}</small>`;
  wearRows($('twear'), v.truck.wear);
  if (v.trailer) { $('trName').textContent = v.trailer.name || t('trailer'); wearRows($('trwear'), v.trailer.wear); }
  else { $('trName').textContent = t('noTrailer'); $('trwear').innerHTML = ''; }
}

function logText(e) {
  if (e.text) return e.text;  // záznamy ze starší verze
  switch (e.kind) {
    case 'fine': return (t('offences')[e.offence]) || e.offence || t('offences').generic;
    case 'toll': return t('logToll');
    case 'ferry': return t('logFerry', e);
    case 'train': return t('logTrain', e);
    case 'job': return t('logJob', e);
    case 'cancel': return t('logCancel');
    case 'dmg': return t('logDmg', { parts: (e.parts || []).map(([k, d]) => `${t(k)} +${nf(d * 100, 1)} %`).join(', ') });
    case 'newSession': return t('logNewSession');
    default: return e.kind;
  }
}

function renderStats(s) {
  const sd = new Date(s.since * 1000), today = sd.toDateString() === new Date().toDateString();
  $('since').textContent = t('sessionSince', { t: (today ? '' : sd.toLocaleDateString(locale, { day: 'numeric', month: 'numeric' }) + ' ') + clock(s.since) });
  $('sKm').innerHTML = `${nf(s.km)}<small>${t('kmDriven')}</small>`;
  $('sTime').innerHTML = `${hm(s.drive_s)}<small>${t('atWheel')}</small>`;
  $('sNet').innerHTML = `<span class="${s.net < 0 ? 'neg' : ''}">${money(s.net)}</span><small>${t('netProfit')}</small>`;
  const rows = [
    ['jobs', `${s.jobs_ok}×`, money(s.income)],
    ['fines', `${s.fines_n}×`, money(-s.fines_sum)],
    ['tolls', `${s.tolls_n}×`, money(-s.tolls_sum)],
    ['transport', `${s.transport_n}×`, money(-s.transport_sum)],
    ['perHour', s.per_hour == null || !s.jobs_ok ? '–' : money(s.per_hour), ''],
    ['fuelUsed', `${nf(s.fuel_l)} l`, s.km > 20 && s.avg_l100 ? `${nf(s.avg_l100, 1)} l/100 km` : ''],
    ['avgSpeed', s.avg_kmh ? `${nf(s.avg_kmh)} km/h` : '–', t('maxSpeed', { v: nf(s.max_kmh) })],
    ['overLimit', hm(s.speeding_s), s.drive_s > 60 ? t('ofDriving', { p: nf(s.speeding_s / s.drive_s * 100) }) : ''],
  ];
  $('srows').innerHTML = rows.map(([k, a, b]) => `<dt>${t(k)}</dt><dd><span style="white-space:nowrap">${a}</span>${b ? `<small>${b}</small>` : ''}</dd>`).join('');
  $('log').innerHTML = s.log.length ? s.log.map(e => `<li><time>${clock(e.t)}</time><span class="${{ fine: 'fine', job: 'job', dmg: 'dmg' }[e.kind] || ''}">${logText(e)}</span><span>${e.amount == null ? '' : money(e.kind === 'job' ? e.amount : -e.amount)}</span></li>`).join('')
    : `<li class="empty">${t('logEmpty')}</li>`;
}

// ============================================================ ovládání
// potvrzení přímo v tlačítku (systémový confirm() se ve fullscreenu na druhém monitoru schová)
let armed = null;
$('reset').onclick = async () => {
  const b = $('reset');
  if (!armed) {
    b.textContent = t('confirmReset'); b.classList.add('armed');
    armed = setTimeout(() => { armed = null; b.textContent = t('newSession'); b.classList.remove('armed'); }, 3000);
    return;
  }
  clearTimeout(armed); armed = null;
  b.textContent = t('newSession'); b.classList.remove('armed');
  await fetch('/api/reset', { method: 'POST', headers: { 'X-Dash': '1' } });
};
document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { if (e.key === 'Escape') $('settings').hidden = true; return; }
  if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (e.key === 'h' || e.key === 'H') $('history').hidden ? openHistory() : ($('history').hidden = true);
  if (e.key === 'Escape') { $('history').hidden = true; $('settings').hidden = true; closeDelivery(); }
});

// ---------- souhrn po doručení ----------
let shownDelivery = null, closedDelivery = null;
function showDelivery(d) {
  if (!d || d.t === closedDelivery) { if (!d) $('delivery').hidden = true; return; }
  shownDelivery = d.t;
  $('dTitle').textContent = d.ok ? t('delivered') : t('cancelled');
  $('dTitle').parentElement.classList.toggle('cancel', !d.ok);
  $('dRoute').textContent = `${d.from} → ${d.to}`;
  $('dRev').textContent = money(d.revenue);
  $('dXp').textContent = d.xp != null ? `${nf(d.xp)} XP` : '–';
  $('dKm').textContent = d.km ? `${nf(d.km)} km` : '–';
  $('dDmg').textContent = d.damage != null ? `${nf(d.damage * 100, 1)} %` : '–';
  const st = d.style;
  $('dStyle').hidden = !st;
  if (st) {
    $('dScore').textContent = st.score;
    $('dScore').parentElement.className = 'dscore' + (st.score >= 75 ? '' : st.score >= 50 ? ' mid' : ' low');
    $('dGrade').textContent = gradeOf(st.score);
    $('dStyleTxt').textContent = t('styleDetail', { b: st.brakes, c: st.corners, h: st.hits, s: st.speeding });
  }
  $('delivery').hidden = false;
}
const gradeOf = sc => t('grades')[sc >= 90 ? 3 : sc >= 75 ? 2 : sc >= 50 ? 1 : 0];
function closeDelivery() { closedDelivery = shownDelivery; $('delivery').hidden = true; }
$('delivery').onclick = closeDelivery;

// ---------- historie ----------
async function openHistory(game) {
  const h = await (await fetch('/api/history?game=' + encodeURIComponent(game || gameKey.toUpperCase()))).json();
  if (h.settings) setSettings(h.settings);
  const g = h.game.toLowerCase(), m = v => money(v, g);
  const perKmDigits = curOf(g).currency === 'CZK' ? 0 : 2;
  const tabs = Array.from(new Set([...h.games, h.game])).sort();
  $('hTabs').innerHTML = tabs.length > 1 ? tabs.map(x => `<button class="${x === h.game ? 'on' : ''}" data-game="${x}">${x}</button>`).join('') : '';
  $('hTabs').querySelectorAll('button').forEach(b => { b.onclick = () => openHistory(b.dataset.game); });
  const tt = h.totals;
  $('hTotals').innerHTML = [
    [`${tt.ok}×`, t('hDelivered')], [m(tt.revenue), t('hRevenue')], [`${nf(tt.km)} km`, t('hKm')],
    [tt.km ? money(tt.revenue / tt.km, g, perKmDigits) : '–', t('hPerKm')],
    [h.best ? `${h.best.src} → ${h.best.dst}` : '–', h.best ? t('hBestPer', { v: money(h.best.revenue / h.best.km, g, perKmDigits) }) : t('hBest')],
  ].map(([a, b]) => `<div>${a}<small>${b}</small></div>`).join('');
  const max = Math.max(1, ...h.days.map(d => d.revenue));
  const compact = new Intl.NumberFormat(locale, { notation: 'compact', maximumFractionDigits: 1 });
  $('hDays').innerHTML = h.days.length ? h.days.map(d => {
    const [, mo, dd] = d.day.split('-');
    const label = lang === 'en' ? `${+dd}/${+mo}` : `${+dd}. ${+mo}.`;
    return `<div class="day" title="${t('hDayTip', { n: d.n, km: nf(d.km) })}"><em>${compact.format(d.revenue * curOf(g).rate)}</em><i style="height:${Math.max(0, d.revenue) / max * 85}%"></i><span>${label}</span></div>`;
  }).join('') : `<p class="empty">${t('hEmpty')}</p>`;
  $('hJobs').innerHTML = `<tr><th>${t('thWhen')}</th><th>${t('thRoute')}</th><th>${t('thCargo')}</th><th class="r">km</th><th class="r">${t('thRevenue')}</th><th class="r">${t('thPerKm', { c: curSym(g) })}</th><th class="r">${t('thDamage')}</th><th class="r">${t('thStyle')}</th></tr>` +
    h.jobs.map(j => {
      const km = j.driven_km > 0 ? j.driven_km : j.planned_km;
      const when = new Date(j.ts * 1000).toLocaleString(locale, { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
      return `<tr class="${j.ok ? '' : 'bad'}"><td>${when}</td><td>${j.src} → ${j.dst}</td><td>${j.cargo}</td><td class="r">${nf(km)}</td><td class="r">${m(j.revenue)}</td><td class="r">${j.ok && km ? nf(j.revenue * curOf(g).rate / km, perKmDigits) : '–'}</td><td class="r">${j.ok ? nf(j.damage * 100, 1) + ' %' : t('hCancelled')}</td><td class="r">${j.score == null ? '–' : `<span class="${j.score >= 75 ? 'sc-hi' : j.score >= 50 ? 'sc-mid' : 'sc-low'}" title="${gradeOf(j.score)}">${j.score}</span>`}</td></tr>`;
    }).join('');
  $('history').hidden = false;
}
$('histBtn').onclick = () => openHistory();
$('histClose').onclick = () => { $('history').hidden = true; };

// ---------- nastavení ----------
function fillCurrencies(sel, value) {
  sel.innerHTML = CURRENCIES.map(c => `<option value="${c}"${c === value ? ' selected' : ''}>${c}</option>`).join('');
}
function syncRate(g) {
  const cur = $(g === 'ets2' ? 'sEtsCur' : 'sAtsCur').value, inp = $(g === 'ets2' ? 'sEtsRate' : 'sAtsRate');
  const native = NATIVE[g];
  if (cur === native) { inp.value = 1; inp.disabled = true; } else inp.disabled = false;
  $(g === 'ets2' ? 'sEtsUnit' : 'sAtsUnit').textContent = cur;
}
function openSettings() {
  $('sLang').value = settings.lang;
  fillCurrencies($('sEtsCur'), settings.ets2.currency); $('sEtsRate').value = settings.ets2.rate;
  fillCurrencies($('sAtsCur'), settings.ats.currency); $('sAtsRate').value = settings.ats.rate;
  syncRate('ets2'); syncRate('ats');
  $('settings').hidden = false;
}
[['ets2', 'sEtsCur', 'sEtsRate'], ['ats', 'sAtsCur', 'sAtsRate']].forEach(([g, cur, rate]) => {
  $(cur).onchange = () => { $(rate).value = DEFAULT_RATES[NATIVE[g]][$(cur).value]; syncRate(g); };
});
$('setBtn').onclick = openSettings;
$('sCancel').onclick = () => { $('settings').hidden = true; };
$('sSave').onclick = async () => {
  const num = id => { const x = parseFloat(String($(id).value).replace(',', '.')); return x > 0 ? x : 1; };
  const s = {
    lang: $('sLang').value,
    ets2: { currency: $('sEtsCur').value, rate: num('sEtsRate') },
    ats: { currency: $('sAtsCur').value, rate: num('sAtsRate') },
  };
  const res = await fetch('/api/settings', { method: 'POST', headers: { 'X-Dash': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(s) });
  if (res.ok) { setSettings(s); if (lastView) render(lastView); $('settings').hidden = true; }
};

// reálné hodiny běží nezávisle na hře
function tickClock() { $('rtime').textContent = new Date().toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' }); }
setInterval(tickClock, 1000);

applyStatic(); tickClock();
function connect() {
  const es = new EventSource('/events');
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => { document.body.classList.add('offline'); };
}
connect();
</script>
</body>
</html>
